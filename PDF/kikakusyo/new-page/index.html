<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待たずに獲りにいく。インスタ&スレッズ集客</title>
<style>
  :root{
    --bg: #f4f8f1;
    --bg2: #e8f1e3;
    --ink: #2a3527;
    --gold: #6f9c5f;
    --gold-soft: rgba(111,156,95,0.7);
    --plum: #4f8a82;
    --rose: #c17a56;
    --ivory: #2a3527;
    --card: rgba(60,90,50,0.05);
    --card-border: rgba(60,90,50,0.14);
    --muted: #6e7d68;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(ellipse at 20% 10%, var(--bg2) 0%, var(--bg) 55%),
                var(--bg);
    color: var(--ivory);
    font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    overflow: hidden;
    width: 100vw; height: 100vh;
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  .serif{
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', '游明朝', serif;
  }

  .glow{
    position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    filter: blur(70px);
  }
  .glow-gold{ width:560px; height:560px; background: radial-gradient(circle, rgba(111,156,95,0.20), transparent 70%);
    top:-140px; right:-140px; }
  .glow-plum{ width:520px; height:520px; background: radial-gradient(circle, rgba(79,138,130,0.16), transparent 70%);
    bottom:-160px; left:-120px; }

  #stage{
    position: relative; z-index: 1;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 6vw 8vw;
  }

  .slide{
    width: 100%; max-width: 980px;
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: rise 0.5s ease;
  }
  .slide.active{ display:flex; }

  @keyframes rise{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .tag{
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--gold-soft);
    border: 1px solid rgba(111,156,95,0.4);
    padding: 0.5em 1.4em;
    border-radius: 999px;
    margin-bottom: 2.2rem;
    text-transform: uppercase;
  }

  h1.title{
    font-size: clamp(2.3rem, 5.4vw, 4rem);
    line-height: 1.4;
    font-weight: 700;
  }
  h1.title .accent{
    color: var(--gold);
  }

  h2.sub{
    margin-top: 1.6rem;
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  .divider{
    width: 46px; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--plum));
    margin: 2rem auto;
  }

  .heading{
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    font-weight: 700;
    margin-bottom: 2.4rem;
  }
  .heading .accent{ color: var(--gold); }

  ul.bullets{
    list-style: none;
    display: flex; flex-direction: column; gap: 1.1rem;
    width: 100%;
  }
  ul.bullets li{
    font-size: clamp(1.05rem, 2vw, 1.5rem);
    line-height: 1.6;
    padding: 1rem 1.4rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    text-align: left;
  }
  ul.bullets li .small{
    display:block; margin-top:0.35rem; font-size:0.85rem; color: var(--muted); font-weight:400;
  }

  ul.bullets.plain{ gap: 0.9rem; align-items: center; }
  ul.bullets.plain li{
    background: none;
    border: none;
    padding: 0;
    text-align: center;
    font-size: clamp(1.15rem, 2.2vw, 1.65rem);
  }

  .statement{
    font-size: clamp(1.6rem, 4vw, 2.7rem);
    line-height: 1.75;
    font-weight: 700;
  }
  .statement .accent{ color: var(--gold); }
  .statement .plum{ color: var(--plum); }
  .statement-note{
    margin-top: 1.8rem;
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    color: var(--muted);
    line-height: 1.8;
  }
  .statement-pre{
    margin-bottom: 1.2rem;
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    color: var(--gold-soft);
    letter-spacing: 0.15em;
  }

  .quote-mark{ font-size: 3rem; color: var(--gold); line-height: 1; margin-bottom: 0.5rem; font-family: serif; }

  .steps{
    display:flex; flex-direction:column; gap: 1rem; width:100%;
  }
  .step{
    display:flex; align-items:center; gap:1.2rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1rem 1.5rem;
    text-align:left;
  }
  .step .num{
    flex-shrink:0;
    width: 2.4rem; height:2.4rem;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--gold), var(--plum));
    color: #fdfdf9;
    font-weight:700;
    font-size:1.1rem;
  }
  .step .txt{ font-size: clamp(0.95rem, 1.8vw, 1.25rem); line-height:1.55; }
  .step .txt .small{ display:block; font-size:0.8rem; color:var(--muted); margin-top:0.3rem; }
  .step-arrow{ color: var(--gold-soft); font-size:1.2rem; text-align:center; }

  .pyramid{
    display:flex; flex-direction:column; gap:0.65rem; width:100%; align-items:center;
  }
  .prow{
    padding: 0.75rem 1.2rem;
    border-radius: 8px;
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    background: var(--card);
    border: 1px solid var(--card-border);
  }
  .prow .label{ font-size:0.72rem; color:var(--gold-soft); letter-spacing:0.15em; display:block; margin-bottom:0.3rem; }
  .prow.narrow{ width: 46%; border-left:3px solid var(--gold); }
  .prow.wide{ width: 92%; border-left:3px solid var(--muted); }
  .prow.plain{
    background:none; border:none; border-radius:0; border-left:none;
    padding: 0.45rem 0;
    font-size: clamp(1.05rem, 2vw, 1.35rem);
  }
  .prow.plain .label{ font-size:0.85rem; color:var(--plum); font-weight:600; }

  .compare{
    display:flex; gap: 2.5rem; justify-content:center; width:100%; flex-wrap:wrap;
  }
  .compare .card{
    flex:1; min-width: 240px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 2rem 1.5rem;
  }
  .compare .card .label{ font-size:0.9rem; color:var(--muted); margin-bottom:0.8rem; }
  .compare .card .num{ font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight:800; }
  .compare .card.hi .num{ color: var(--gold); }
  .compare .vs{ align-self:center; color:var(--muted); font-size:1.2rem; }

  .imgpair{
    display:flex; gap: 2rem; justify-content:center; width:100%; flex-wrap:wrap;
  }
  .imgpair .col{
    flex:1; min-width: 220px; max-width: 380px;
    display:flex; flex-direction:column; align-items:center; gap: 0.9rem;
  }
  .imgpair .col .label{
    font-size:0.85rem; letter-spacing:0.1em; color: var(--muted);
  }
  .imgpair .col img{
    width:100%; max-height: 46vh;
    object-fit: contain;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card);
  }
  .imgpair .col.big{ max-width: 550px; }
  .imgpair .col.big img{ max-height: 65vh; }

  .imgpair.vertical{ flex-direction: column; align-items:center; }

  .imgpair.large{ gap: 0.8rem; }
  .imgpair.large .col{ max-width: 1200px; }
  .imgpair.large .col img{ max-height: 98vh; }

  .single-img{ width:100%; display:flex; align-items:center; justify-content:center; }
  .single-img img{
    max-width: 100%; max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card);
  }

  .dialogue{
    display:flex; flex-direction:column; gap:1.4rem; width:100%;
  }
  .dbox{
    text-align:left;
    padding: 1.1rem 1.4rem;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--card-border);
  }
  .dbox .who{ font-size:0.75rem; letter-spacing:0.15em; color:var(--muted); margin-bottom:0.5rem; }
  .dbox.bad{ border-left:3px solid var(--rose); }
  .dbox.good{ border-left:3px solid var(--gold); }
  .dbox p{ font-size: clamp(0.95rem, 1.7vw, 1.15rem); line-height:1.7; }

  .closing .title{ font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight:800; }
  .closing .note{ margin-top:1.6rem; color:var(--muted); font-size:1rem; line-height:1.9; }

  /* nav */
  #progress{
    position: fixed; top:0; left:0; height:2px;
    background: linear-gradient(90deg, var(--gold), var(--plum));
    z-index: 5; transition: width 0.3s ease;
  }
  #counter{
    position: fixed; bottom: 1.6rem; right: 1.8rem;
    font-size: 0.8rem; color: var(--muted);
    letter-spacing: 0.1em; z-index: 5;
    font-variant-numeric: tabular-nums;
  }
  #counter .cur{ color: var(--gold); }

  .navhint{
    position: fixed; bottom: 1.6rem; left: 1.8rem;
    font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; z-index:5;
  }

  .arrowbtn{
    position: fixed; top:50%; transform: translateY(-50%);
    width: 42px; height:42px; border-radius:50%;
    background: rgba(60,90,50,0.05);
    border: 1px solid rgba(60,90,50,0.14);
    color: var(--ivory);
    display:flex; align-items:center; justify-content:center;
    font-size: 1.1rem; z-index: 5; cursor:pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
    opacity: 0.55;
  }
  .arrowbtn:hover{ background: rgba(111,156,95,0.18); opacity:1; }
  #prevBtn{ left: 1.6rem; }
  #nextBtn{ right: 1.6rem; }

  @media (max-width: 640px){
    .arrowbtn{ display:none; }
    #stage{ padding: 8vw 6vw; }
    .compare{ gap:1rem; }
  }
</style>
</head>
<body>

<div class="glow glow-gold"></div>
<div class="glow glow-plum"></div>

<div id="progress" style="width:0%"></div>
<div id="stage"></div>
<div class="navhint">← → または クリックで進む</div>
<div id="counter"><span class="cur">1</span> / <span class="total"></span></div>
<div class="arrowbtn" id="prevBtn">‹</div>
<div class="arrowbtn" id="nextBtn">›</div>

  { type:'closing',
    title:'これで一連の流れをお伝えしました',
    note:'ここから先、具体的にやることはまだ色々あります。<br>興味がある方が多ければ、追加のセミナーも検討します。<br><br><span style="font-size:1.3em">感想や質問、ぜひたくさんお聞かせください！</span>' }
];

let idx = 0;
const stage = document.getElementById('stage');
const total = SLIDES.length;
document.querySelector('.total').textContent = total;

function esc(s){ return s; }

function renderSlide(s){
  const wrap = document.createElement('div');
  wrap.className = 'slide active';

  if(s.type === 'title'){
    wrap.innerHTML = `
      <div class="tag">${s.tag}</div>
      <h1 class="title serif">${s.title.join('<br>')}</h1>
      <h2 class="sub">${s.sub}</h2>`;
  }
  else if(s.type === 'bullets'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <ul class="bullets${s.plain ? ' plain' : ''}">
        ${s.items.map(it => `<li>${it}</li>`).join('')}
      </ul>
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'statement'){
    wrap.innerHTML = `
      ${s.pretext ? `<div class="statement-pre">${s.pretext}</div>` : ''}
      <div class="statement serif">${s.text}</div>
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'steps'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <div class="steps">
        ${s.items.map((it,i) => `
          <div class="step">
            <div class="num">${(s.startNum || 1)+i}</div>
            <div class="txt">${it}</div>
          </div>`).join(s.arrows ? '<div class="step-arrow">↓</div>' : '')}
      </div>
      ${s.images ? `<div class="imgpair" style="margin-top:1.6rem">${s.images.map(src => `<div class="col${s.imagesBig ? ' big' : ''}"><img src="${src}" alt=""></div>`).join('')}</div>` : ''}
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'pyramid'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <div class="pyramid">
        ${s.rows.map(r => `
          <div class="prow ${r.w}${s.plain ? ' plain' : ''}">
            <span class="label">${r.label}</span>
            ${r.text}
          </div>`).join('')}
      </div>
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'compare'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <div class="compare">
        <div class="card"><div class="label">${s.left.label}</div><div class="num">${s.left.num}</div></div>
        <div class="vs">VS</div>
        <div class="card hi"><div class="label">${s.right.label}</div><div class="num">${s.right.num}</div></div>
      </div>
      ${(s.left.img || s.right.img) ? `
      <div class="imgpair" style="margin-top:1.6rem">
        ${s.left.img ? `<div class="col"><img src="${s.left.img}" alt=""></div>` : ''}
        ${s.right.img ? `<div class="col"><img src="${s.right.img}" alt=""></div>` : ''}
      </div>` : ''}
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'imagepair'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <div class="imgpair${s.large ? ' large' : ''}">
        <div class="col${s.left.big ? ' big' : ''}"><img src="${s.left.src}" alt="${s.left.label}"><div class="label">${s.left.label}</div></div>
        <div class="col${s.right.big ? ' big' : ''}"><img src="${s.right.src}" alt="${s.right.label}"><div class="label">${s.right.label}</div></div>
      </div>
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'image'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <div class="single-img"><img src="${s.src}" alt=""></div>
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'imagegroup'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <div class="imgpair${s.vertical ? ' vertical' : ''}">
        ${s.items.map(src => `<div class="col${s.big ? ' big' : ''}"><img src="${src}" alt=""></div>`).join('')}
      </div>
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'dialogue'){
    wrap.innerHTML = `
      ${s.heading ? `<div class="heading serif">${s.heading}</div>` : ''}
      <div class="dialogue">
        ${s.boxes.map(b => `
          <div class="dbox ${b.bad ? 'bad' : 'good'}">
            <div class="who">${b.who}</div>
            <p>${b.text}</p>
          </div>`).join('')}
      </div>
      ${s.note ? `<div class="statement-note">${s.note}</div>` : ''}`;
  }
  else if(s.type === 'closing'){
    wrap.innerHTML = `
      <div class="closing">
        <div class="title serif">${s.title}</div>
        <div class="divider"></div>
        <div class="note">${s.note}</div>
      </div>`;
  }
  return wrap;
}

function show(i){
  idx = Math.max(0, Math.min(total - 1, i));
  stage.innerHTML = '';
  stage.appendChild(renderSlide(SLIDES[idx]));
  document.querySelector('.cur').textContent = idx + 1;
  document.getElementById('progress').style.width = ((idx+1)/total*100) + '%';
}

function next(){ if(idx < total-1) show(idx+1); }
function prev(){ if(idx > 0) show(idx-1); }

document.body.addEventListener('click', (e) => {
  if(e.target.closest('.arrowbtn')) return;
  const x = e.clientX / window.innerWidth;
  if(x < 0.3) prev(); else next();
});

document.getElementById('nextBtn').addEventListener('click', (e) => { e.stopPropagation(); next(); });
document.getElementById('prevBtn').addEventListener('click', (e) => { e.stopPropagation(); prev(); });

window.addEventListener('keydown', (e) => {
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)) next();
  else if(['ArrowLeft','ArrowUp','Backspace','PageUp'].includes(e.key)) prev();
});

show(0);
</script>
</body>
</html>
